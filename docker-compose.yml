services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: docx-pdf-converter

    ports:
      - "80:80"

    volumes:
      - ./data/uploads:/app/backend/uploads
      - ./data/outputs:/app/backend/outputs
      - ./data/temp:/app/backend/temp

    environment:
      PYTHONUNBUFFERED: "1"
      LIBREOFFICE_PATH: "/usr/bin/libreoffice"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - docx-network


networks:
  docx-network:
    driver: bridge
